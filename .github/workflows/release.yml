name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Compile Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev
      - name: Bootstrap, test, compile, package
        working-directory: native
        run: |
          chmod +x tool/bootstrap.sh tool/package.sh packaging/install.sh
          ./tool/bootstrap.sh
          flutter test test/store_test.dart
          flutter build linux --release --no-tree-shake-icons
          ./tool/package.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omadash-linux-x64
          path: dist/*
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TITLE="Omadash ${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file docs/RELEASE.md --latest
          else
            gh release create "$TAG" dist/* \
              --title "$TITLE" \
              --notes-file docs/RELEASE.md \
              --latest \
              --verify-tag
          fi
