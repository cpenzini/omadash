name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    name: Native tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Test
        run: flutter test test/store_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  web:
    name: Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run typecheck
