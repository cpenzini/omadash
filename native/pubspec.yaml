name: omadash
description: Native mail and calendar for Omarchy. Keyboard-first, no Electron.
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_omarchy: ^0.3.0
  enough_mail: ^2.1.7
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
